# =====================================================================
# bydopamina.pl – fragment konfiguracji nginx (VPS / serwer dedykowany)
# Dołącz w bloku server { } po zdefiniowaniu root i fastcgi_pass.
# =====================================================================

# Limit prób logowania i żądań do Store API (strefy definiuje się w http { }):
#   limit_req_zone $binary_remote_addr zone=bd_login:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=bd_api:10m rate=10r/s;

server_tokens off;
client_max_body_size 10m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Logowanie – limit 5 prób/min z IP
location = /wp-login.php {
	limit_req zone=bd_login burst=3 nodelay;
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_pass php;
}

# Store API WooCommerce (koszyk/checkout blokowy) – ochrona przed card testing
location ^~ /wp-json/wc/store/ {
	limit_req zone=bd_api burst=20 nodelay;
	try_files $uri $uri/ /index.php?$args;
}

location = /xmlrpc.php { deny all; return 403; }
location ~* ^/wp-content/uploads/.*\.(php[0-9]?|phtml|phar)$ { deny all; }
location ~* ^/wp-includes/[^/]+\.php$ { deny all; }
location ~ /\.(?!well-known) { deny all; }
location ~* \.(bak|backup|old|orig|sql|swp|log|ini|env|dist)$ { deny all; }
location ~* ^/(wp-config\.php|readme\.html|license\.txt|debug\.log)$ { deny all; }

if ($args ~* "(^|&)author=\d+") { return 403; }

location ~* \.(css|js|woff2|avif|webp|jpe?g|png|gif|svg|ico)$ {
	expires 1y;
	add_header Cache-Control "public, immutable";
	access_log off;
}
